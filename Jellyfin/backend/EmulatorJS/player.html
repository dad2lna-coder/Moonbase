<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Moonfin Game</title>
    <style>
      html, body, #game { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #moonfin-error {
        display: none;
        position: fixed;
        z-index: 30;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        background: #000;
        color: #fff;
        font-family: sans-serif;
        padding: 24px;
        line-height: 1.5;
      }
      .ejs_virtualGamepad_open {
        top: calc(8px + env(safe-area-inset-top, 0px)) !important;
        right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        width: 40px !important;
        height: 40px !important;
        opacity: 0.85 !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="moonfin-error" style="display:none"></div>
    <script>
      // Query params (URL-encoded): core, rom (with &ApiKey=), bios, biosName, parent, save, sram, name.
      // Arcade and MAME must not use EJS_biosUrl. EmulatorJS 4.2.3 unzips every bios download
      // (gotData -> checkCompression), and EJS_dontExtractBIOS writes a full URL as the path.
      // FBNeo only opens /neogeo.zip. EJS_externalFiles writes those bytes to that exact path.
      (function () {
        var params = new URLSearchParams(location.search);
        var core = params.get('core');
        var rom = params.get('rom');
        if (!core || !rom) {
          var err = document.getElementById('moonfin-error');
          err.style.display = 'block';
          err.textContent = 'Missing required parameters (core, rom).';
          return;
        }
        // Substituted by the server: self-hosted cores when installed, otherwise the CDN.
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameUrl = rom;
        window.EJS_pathtodata = '__EJS_PATHTODATA__';
        window.EJS_startOnLoaded = true;
        window.EJS_threads = !!self.crossOriginIsolated;

        function showError(text) {
          var err = document.getElementById('moonfin-error');
          if (!err) { return; }
          err.style.display = 'block';
          err.textContent = text;
        }

        // A BIOS or parent archive name. Rejects paths so the FS key stays a single file.
        function archiveName(value) {
          if (value == null) { return null; }
          var text = String(value).replace(/^\uFEFF/, '').trim();
          if ((text.charAt(0) === '"' && text.charAt(text.length - 1) === '"') ||
              (text.charAt(0) === "'" && text.charAt(text.length - 1) === "'")) {
            text = text.slice(1, -1).trim();
          }
          try { text = decodeURIComponent(text); } catch (e) { /* already decoded */ }
          var base = text.split(/[\\/]/).pop();
          if (!base || base.indexOf('..') !== -1) { return null; }
          if (!/^[^\\/]+\.(zip|7z)$/i.test(base)) { return null; }
          return base;
        }

        function nameFromUrl(url) {
          try {
            return archiveName(new URL(url, location.href).pathname.split('/').pop());
          } catch (e) {
            return null;
          }
        }

        function nameFromDisposition(header) {
          if (!header) { return null; }
          var star = /filename\*\s*=\s*[^']*''([^;]+)/i.exec(header);
          if (star) {
            var starred = archiveName(star[1].trim());
            if (starred) { return starred; }
          }
          var quoted = /filename\s*=\s*"([^"]+)"/i.exec(header);
          if (quoted) {
            var fromQuotes = archiveName(quoted[1]);
            if (fromQuotes) { return fromQuotes; }
          }
          var plain = /filename\s*=\s*([^;]+)/i.exec(header);
          return plain ? archiveName(plain[1].trim()) : null;
        }

        function sameOrigin(url) {
          try {
            return new URL(url, location.href).origin === location.origin;
          } catch (e) {
            return false;
          }
        }

        // biosName, then a .zip/.7z path segment, then Content-Disposition from a same-origin HEAD.
        function resolveArchiveName(url, explicitName) {
          var named = archiveName(explicitName);
          if (named) { return Promise.resolve(named); }
          var fromUrl = nameFromUrl(url);
          if (fromUrl) { return Promise.resolve(fromUrl); }
          if (!sameOrigin(url) || typeof fetch !== 'function') { return Promise.resolve(null); }
          return fetch(url, { method: 'HEAD', credentials: 'same-origin' }).then(function (response) {
            if (!response || !response.ok || !response.headers || !response.headers.get) { return null; }
            return nameFromDisposition(response.headers.get('Content-Disposition'));
          }).catch(function () { return null; });
        }

        function publish(files) {
          if (files && Object.keys(files).length) { window.EJS_externalFiles = files; }
          return true;
        }

        var bios = params.get('bios');
        var parent = params.get('parent');
        // fbneo/mame2003 are the same zip cores under older client names.
        var arcade = isArcadeFamily(core);
        function isArcadeFamily(name) {
          switch (String(name || '').toLowerCase()) {
            case 'arcade':
            case 'mame':
            case 'fbneo':
            case 'mame2003':
            case 'mame2003_plus':
              return true;
            default:
              return false;
          }
        }
        if (arcade && (bios || parent)) {
          // Named before the emulator loader. A missing name must not fall back to EJS_biosUrl.
          window.moonfinBeforeLoader = (bios ? resolveArchiveName(bios, params.get('biosName')) : Promise.resolve(null)).then(function (biosFileName) {
            if (bios && !biosFileName) {
              showError('Could not determine the arcade BIOS file name.');
              return false;
            }
            var files = {};
            if (biosFileName) { files['/' + biosFileName] = bios; }
            if (!parent) { return publish(files); }
            return resolveArchiveName(parent, null).then(function (parentFileName) {
              if (parentFileName) { files['/' + parentFileName] = parent; }
              return publish(files);
            });
          });
        } else if (bios) {
          window.EJS_biosUrl = bios;
        }

        var save = params.get('save');
        if (save) { window.EJS_loadStateURL = save; }
        // A save state already holds the battery save, so a Continue skips it.
        var sram = params.get('sram');
        if (sram && !save) { window.moonfinSramUrl = sram; }
        var name = params.get('name');
        if (name) { window.EJS_gameName = name; }
      })();
    </script>
    <!-- Must load before EmulatorJS: the native host may call these globals immediately. -->
    <script src="moonfin-bridge.js"></script>
    <script>
      // Load the EmulatorJS loader from the resolved data path (self-host or CDN).
      // Arcade BIOS (and an optional parent zip) must be named before this runs.
      (function () {
        // Emscripten FS.writeFile rejects a raw ArrayBuffer ("Unsupported data type")
        // after creating a 0-byte file. loadExternalFiles hands it one. Convert first.
        function toUint8Array(data) {
          if (!data) { return data; }
          if (typeof ArrayBuffer !== 'undefined' && ArrayBuffer.isView(data)) {
            return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
          }
          if (data instanceof ArrayBuffer) { return new Uint8Array(data); }
          return data;
        }

        function wrapWriteFile(Ctor) {
          var proto = Ctor && Ctor.prototype;
          if (!proto || typeof proto.writeFile !== 'function' || proto.writeFile.moonfinBytes) { return; }
          var original = proto.writeFile;
          function writeFile(path, data) {
            return original.call(this, path, toUint8Array(data));
          }
          writeFile.moonfinBytes = true;
          proto.writeFile = writeFile;
        }

        var gameManager = window.EJS_GameManager;
        try {
          Object.defineProperty(window, 'EJS_GameManager', {
            configurable: true,
            enumerable: true,
            get: function () { return gameManager; },
            set: function (value) {
              gameManager = value;
              wrapWriteFile(value);
            }
          });
        } catch (e) { /* already sealed; wrap whatever is there */ }
        if (gameManager) { wrapWriteFile(gameManager); }

        function showDownloadError(path) {
          var err = document.getElementById('moonfin-error');
          if (!err) { return; }
          err.style.display = 'block';
          err.textContent = 'Could not download ' + path + '.';
        }

        function watchExternalDownloads() {
          var files = window.EJS_externalFiles;
          if (!files || window.moonfinExternalWatch || typeof XMLHttpRequest !== 'function') { return; }
          var expected = [];
          for (var key in files) {
            var href = files[key];
            try { href = new URL(files[key], location.href).href; } catch (e) { /* keep raw */ }
            expected.push({ path: key, href: href });
          }
          if (!expected.length) { return; }
          window.moonfinExternalWatch = true;
          var Native = XMLHttpRequest;
          function PatchedXhr() {
            var xhr = new Native();
            var requestHref = '';
            var open = xhr.open;
            xhr.open = function (method, url) {
              requestHref = url;
              try { requestHref = new URL(url, location.href).href; } catch (e) { /* keep raw */ }
              return open.apply(xhr, arguments);
            };
            function fail() {
              for (var i = 0; i < expected.length; i++) {
                if (expected[i].href === requestHref) {
                  showDownloadError(expected[i].path);
                  return;
                }
              }
            }
            xhr.addEventListener('error', fail);
            xhr.addEventListener('abort', fail);
            xhr.addEventListener('load', function () {
              if (xhr.status >= 400) { fail(); }
            });
            return xhr;
          }
          PatchedXhr.prototype = Native.prototype;
          window.XMLHttpRequest = PatchedXhr;
        }

        function load() {
          var base = window.EJS_pathtodata;
          if (!base) { return; }
          watchExternalDownloads();
          var s = document.createElement('script');
          s.src = base + 'loader.js';
          document.body.appendChild(s);
        }
        var pending = window.moonfinBeforeLoader;
        if (pending && typeof pending.then === 'function') {
          pending.then(function (ok) {
            if (ok === false) { return; }
            load();
          }, function () { /* do not start without the arcade zip name */ });
        } else {
          load();
        }
      })();
    </script>
  </body>
</html>
