<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Moonfin Game</title>
    <style>
      html, body, #game {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #moonfin-error {
        display: none;
        position: fixed;
        z-index: 30;
        left: 0;
        top: 0;
        right: 0;
        bottom: 0;
        box-sizing: border-box;
        background: #000;
        color: #fff;
        font-family: sans-serif;
        padding: 24px;
        line-height: 1.5;
      }
      /* EmulatorJS pins its menu toggle to the top-right corner (top:5px;right:5px),
         which lands under a phone's curved corner / camera cutout. Push it into the
         safe area and enlarge it so it's tappable. */
      .ejs_virtualGamepad_open {
        top: calc(8px + env(safe-area-inset-top, 0px)) !important;
        right: calc(8px + env(safe-area-inset-right, 0px)) !important;
        width: 40px !important;
        height: 40px !important;
        opacity: 0.85 !important;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="moonfin-error" style="display:none"></div>

    <script>
      // Query params (URL-encoded): core, rom (with &api_key=), bios, save, name.
      (function () {
        var params = new URLSearchParams(location.search);
        var core = params.get('core');
        var rom = params.get('rom');

        if (!core || !rom) {
          var err = document.getElementById('moonfin-error');
          err.style.display = 'block';
          err.textContent = 'Missing required parameters (core, rom).';
          return;
        }

        // __EJS_PATHTODATA__ is substituted by the server: self-hosted cores when installed,
        // otherwise the EmulatorJS CDN so games work with zero setup.
        window.EJS_player = '#game';
        window.EJS_core = core;
        window.EJS_gameUrl = rom;
        window.EJS_pathtodata = '__EJS_PATHTODATA__';
        window.EJS_startOnLoaded = true;
        // Threads (SharedArrayBuffer) are only available when the server served this document
        // cross-origin isolated, which it does only for cores that require it (e.g. PSP).
        // Cartridge and single-threaded disc cores keep running without isolation.
        window.EJS_threads = !!self.crossOriginIsolated;

        function showError(text) {
          var err = document.getElementById('moonfin-error');
          if (!err) { return; }
          err.style.display = 'block';
          err.textContent = text;
        }

        // A BIOS or parent archive name. Rejects paths so the FS key stays a single file.
        function archiveName(value) {
          if (value == null) { return null; }
          var text = String(value).replace(/^\uFEFF/, '').trim();
          if ((text.charAt(0) === '"' && text.charAt(text.length - 1) === '"') ||
              (text.charAt(0) === "'" && text.charAt(text.length - 1) === "'")) {
            text = text.slice(1, -1).trim();
          }
          try { text = decodeURIComponent(text); } catch (e) { /* already decoded */ }
          var base = text.split(/[\\/]/).pop();
          if (!base || base.indexOf('..') !== -1) { return null; }
          if (!/^[^\\/]+\.(zip|7z)$/i.test(base)) { return null; }
          return base;
        }

        function nameFromUrl(url) {
          try {
            return archiveName(new URL(url, location.href).pathname.split('/').pop());
          } catch (e) {
            return null;
          }
        }

        function nameFromDisposition(header) {
          if (!header) { return null; }
          var star = /filename\*\s*=\s*[^']*''([^;]+)/i.exec(header);
          if (star) {
            var starred = archiveName(star[1].trim());
            if (starred) { return starred; }
          }
          var quoted = /filename\s*=\s*"([^"]+)"/i.exec(header);
          if (quoted) {
            var fromQuotes = archiveName(quoted[1]);
            if (fromQuotes) { return fromQuotes; }
          }
          var plain = /filename\s*=\s*([^;]+)/i.exec(header);
          return plain ? archiveName(plain[1].trim()) : null;
        }

        function sameOrigin(url) {
          try {
            return new URL(url, location.href).origin === location.origin;
          } catch (e) {
            return false;
          }
        }

        // biosName, then a .zip/.7z path segment, then Content-Disposition from a same-origin HEAD.
        function resolveArchiveName(url, explicitName) {
          var named = archiveName(explicitName);
          if (named) { return Promise.resolve(named); }
          var fromUrl = nameFromUrl(url);
          if (fromUrl) { return Promise.resolve(fromUrl); }
          if (!sameOrigin(url) || typeof fetch !== 'function') { return Promise.resolve(null); }
          return fetch(url, { method: 'HEAD', credentials: 'same-origin' }).then(function (response) {
            if (!response || !response.ok || !response.headers || !response.headers.get) { return null; }
            return nameFromDisposition(response.headers.get('Content-Disposition'));
          }).catch(function () { return null; });
        }

        function publish(files) {
          if (files && Object.keys(files).length) { window.EJS_externalFiles = files; }
          return true;
        }

        var bios = params.get('bios');
        var parent = params.get('parent');
        // Arcade and MAME must not use EJS_biosUrl. EmulatorJS unzips that download, so FBNeo
        // never sees /neogeo.zip. EJS_externalFiles writes the raw archive before the ROM loads.
        // fbneo/mame2003 are the same zip cores under older client names.
        var arcade = isArcadeFamily(core);
        function isArcadeFamily(name) {
          switch (String(name || '').toLowerCase()) {
            case 'arcade':
            case 'mame':
            case 'fbneo':
            case 'mame2003':
            case 'mame2003_plus':
              return true;
            default:
              return false;
          }
        }
        if (arcade && (bios || parent)) {
          window.moonfinBeforeLoader = (bios ? resolveArchiveName(bios, params.get('biosName')) : Promise.resolve(null)).then(function (biosFileName) {
            if (bios && !biosFileName) {
              showError('Could not determine the arcade BIOS file name.');
              return false;
            }
            var files = {};
            if (biosFileName) { files['/' + biosFileName] = bios; }
            if (!parent) { return publish(files); }
            return resolveArchiveName(parent, null).then(function (parentFileName) {
              if (parentFileName) { files['/' + parentFileName] = parent; }
              return publish(files);
            });
          });
        } else if (bios) {
          window.EJS_biosUrl = bios;
        }

        var save = params.get('save');
        if (save) { window.EJS_loadStateURL = save; }

        // A save state already holds the battery save, so a Continue skips it.
        var sram = params.get('sram');
        var pendingSram = sram && !save
          ? fetch(sram)
            .then(function (response) { return response.ok ? response.arrayBuffer() : null; })
            .catch(function () { return null; })
          : null;

        var name = params.get('name');
        if (name) { window.EJS_gameName = name; }

        window.EJS_ready = function () {
          postToHost({ type: 'moonfin-ready' });
        };

        function postToHost(message) {
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage(message, '*');
            }
          } catch (e) { /* ignore */ }
          try {
            if (window.flutter_inappwebview) {
              window.flutter_inappwebview.callHandler('moonfinPlayer', message);
            }
          } catch (e) { /* ignore */ }
        }

        // Injects a controller button into the running core (RetroPad button index). The Flutter
        // host forwards hardware-gamepad key events here because the Android System WebView does
        // not reliably expose the browser Gamepad API. Guarded: if a native pad IS visible to the
        // WebView, do nothing and let EmulatorJS read it directly (avoids double input).
        window.moonfinInput = function (index, pressed) {
          try {
            if (navigator.getGamepads) {
              var pads = navigator.getGamepads();
              for (var i = 0; i < pads.length; i++) {
                if (pads[i]) { return; }
              }
            }
            var e = window.EJS_emulator;
            if (e && e.gameManager && e.gameManager.simulateInput) {
              e.gameManager.simulateInput(0, index, pressed ? 1 : 0);
            }
          } catch (e) { /* ignore */ }
        };

        // Returns the current save state as a base64 string, or null on failure.
        window.moonfinGetState = function () {
          try {
            var emu = window.EJS_emulator;
            if (!emu || !emu.gameManager) { return null; }
            var state = emu.gameManager.getState();
            if (!state) { return null; }
            return uint8ToBase64(state);
          } catch (e) {
            return null;
          }
        };

        function uint8ToBase64(bytes) {
          var binary = '';
          var len = bytes.byteLength;
          for (var i = 0; i < len; i++) {
            binary += String.fromCharCode(bytes[i]);
          }
          return btoa(binary);
        }

        function base64ToUint8(b64) {
          var binary = atob(b64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
          return bytes;
        }

        // Returns the battery save as a base64 string, or null when the core keeps none.
        window.moonfinGetSram = function () {
          try {
            var gm = window.EJS_emulator && window.EJS_emulator.gameManager;
            var data = gm && gm.getSaveFile ? gm.getSaveFile(true) : null;
            return data && data.byteLength ? uint8ToBase64(data) : null;
          } catch (e) {
            return null;
          }
        };

        function sameBytes(a, b) {
          if (a.byteLength !== b.byteLength) { return false; }
          for (var i = 0; i < a.byteLength; i++) {
            if (a[i] !== b[i]) { return false; }
          }
          return true;
        }

        // The core reads its battery save only at boot, so a different one is written to the
        // emulator's file system and the game restarted.
        function applySram(bytes) {
          try {
            var gm = window.EJS_emulator && window.EJS_emulator.gameManager;
            if (!gm || !gm.getSaveFilePath || !gm.FS) { return; }
            var current = gm.getSaveFile(true);
            if (current && sameBytes(current, bytes)) { return; }
            var path = gm.getSaveFilePath();
            var parts = path.split('/');
            var dir = '';
            for (var i = 1; i < parts.length - 1; i++) {
              dir += '/' + parts[i];
              if (!gm.FS.analyzePath(dir).exists) { gm.FS.mkdir(dir); }
            }
            gm.FS.writeFile(path, bytes);
            gm.loadSaveFiles();
            gm.restart();
          } catch (e) { /* ignore */ }
        }

        window.EJS_onGameStart = function () {
          if (pendingSram) {
            pendingSram.then(function (buffer) {
              if (buffer && buffer.byteLength) { applySram(new Uint8Array(buffer)); }
            });
          }
        };

        // Loads a save state from a base64 blob (the Moonfin cloud save).
        window.moonfinLoadState = function (b64) {
          try {
            var emu = window.EJS_emulator;
            if (emu && emu.gameManager && b64) {
              emu.gameManager.loadState(base64ToUint8(b64));
            }
          } catch (e) { /* ignore */ }
        };

        window.moonfinRestart = function () {
          try {
            var emu = window.EJS_emulator;
            if (emu && emu.gameManager) { emu.gameManager.restart(); }
          } catch (e) { /* ignore */ }
        };

        window.moonfinFastForward = function (on) {
          try {
            var emu = window.EJS_emulator;
            if (emu && emu.gameManager && emu.gameManager.toggleFastForward) {
              emu.gameManager.toggleFastForward(on ? 1 : 0);
            }
          } catch (e) { /* ignore */ }
        };

        window.moonfinPause = function (paused) {
          try {
            var emu = window.EJS_emulator;
            if (emu && emu.gameManager && emu.gameManager.toggleMainLoop) {
              emu.gameManager.toggleMainLoop(paused ? 0 : 1);
            }
          } catch (e) { /* ignore */ }
        };

        // EmulatorJS's stored settings (control remaps + options), for cloud sync on exit.
        window.moonfinGetSettings = function () {
          try { return localStorage.getItem('ejs-settings'); } catch (e) { return null; }
        };

        // Enumerates the running core's adjustable options (id, label, choices, current) so a
        // native d-pad settings screen can render them. Parses the same string EmulatorJS uses
        // to build its own settings menu. Returns "[]" when the core exposes none.
        window.moonfinGetOptions = function () {
          try {
            var emu = window.EJS_emulator;
            if (!emu || !emu.gameManager || !emu.gameManager.getCoreOptions) { return '[]'; }
            var raw = emu.gameManager.getCoreOptions();
            if (!raw) { return '[]'; }
            var out = [];
            raw.split('\n').forEach(function (line) {
              if (!line) { return; }
              var parts = line.split('; ');
              if (parts.length < 2) { return; }
              var id = parts[0].split('|')[0];
              var choices = parts[1].split('|');
              if (choices.length <= 1) { return; }
              out.push({
                id: id,
                label: id.replace(/_/g, ' ').replace(/.+\-(.+)/, '$1'),
                choices: choices.map(function (c) {
                  return { value: c, label: c.replace('(Default) ', '') };
                }),
                current: emu.getSettingValue ? emu.getSettingValue(id) : null
              });
            });
            // Common general settings by known id with fixed choices; included only when the
            // core/build registered them (getSettingValue returns non-null).
            var general = [
              { id: 'shader', label: 'Shader', choices: ['disabled', '2xScaleHQ', '4xScaleHQ', 'crt-aperture', 'crt-easymode', 'crt-geom', 'crt-mattias', 'sabr', 'bicubic'] },
              { id: 'fps', label: 'FPS counter', choices: ['show', 'hide'] },
              { id: 'vsync', label: 'VSync', choices: ['enabled', 'disabled'] },
              { id: 'ff-ratio', label: 'Fast-forward ratio', choices: ['1.5', '2.0', '2.5', '3.0', '4.0', '5.0', '6.0', '8.0', 'unlimited'] },
              { id: 'sm-ratio', label: 'Slow-motion ratio', choices: ['1.5', '2.0', '2.5', '3.0', '4.0', '5.0'] },
              { id: 'save-state-slot', label: 'Save state slot', choices: ['1', '2', '3', '4', '5', '6', '7', '8', '9'] }
            ];
            general.forEach(function (g) {
              var cur = emu.getSettingValue ? emu.getSettingValue(g.id) : null;
              if (cur == null) { return; }
              out.push({
                id: g.id,
                label: g.label,
                choices: g.choices.map(function (c) { return { value: c, label: c }; }),
                current: cur
              });
            });
            return JSON.stringify(out);
          } catch (e) { return '[]'; }
        };

        window.moonfinSetOption = function (id, value) {
          try {
            var emu = window.EJS_emulator;
            if (emu && emu.changeSettingOption) { emu.changeSettingOption(id, value); }
          } catch (e) { /* ignore */ }
        };

        // Forward hardware-gamepad buttons to the Flutter host on platforms whose WebView
        // exposes the Gamepad API (iOS / desktop). Self-gating: does nothing on Android, where
        // getGamepads() is empty and the native channel provides input instead.
        (function () {
          var prev = {};
          function poll() {
            try {
              var pads = navigator.getGamepads ? navigator.getGamepads() : [];
              var pad = null;
              for (var i = 0; i < pads.length; i++) { if (pads[i]) { pad = pads[i]; break; } }
              if (pad) {
                for (var b = 0; b < pad.buttons.length; b++) {
                  var pressed = !!pad.buttons[b].pressed;
                  if (prev[b] !== pressed) {
                    prev[b] = pressed;
                    postToHost({ type: 'gamepad', index: b, pressed: pressed });
                  }
                }
              }
            } catch (e) { /* ignore */ }
            requestAnimationFrame(poll);
          }
          requestAnimationFrame(poll);
        })();
      })();

      // Load the EmulatorJS loader from the resolved data path (self-host or CDN).
      // Arcade BIOS (and an optional parent zip) must be named before this runs.
      (function () {
        // Emscripten FS.writeFile rejects a raw ArrayBuffer ("Unsupported data type")
        // after creating a 0-byte file. loadExternalFiles hands it one. Convert first.
        function toUint8Array(data) {
          if (!data) { return data; }
          if (typeof ArrayBuffer !== 'undefined' && ArrayBuffer.isView(data)) {
            return new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
          }
          if (data instanceof ArrayBuffer) { return new Uint8Array(data); }
          return data;
        }

        function wrapWriteFile(Ctor) {
          var proto = Ctor && Ctor.prototype;
          if (!proto || typeof proto.writeFile !== 'function' || proto.writeFile.moonfinBytes) { return; }
          var original = proto.writeFile;
          function writeFile(path, data) {
            return original.call(this, path, toUint8Array(data));
          }
          writeFile.moonfinBytes = true;
          proto.writeFile = writeFile;
        }

        var gameManager = window.EJS_GameManager;
        try {
          Object.defineProperty(window, 'EJS_GameManager', {
            configurable: true,
            enumerable: true,
            get: function () { return gameManager; },
            set: function (value) {
              gameManager = value;
              wrapWriteFile(value);
            }
          });
        } catch (e) { /* already sealed; wrap whatever is there */ }
        if (gameManager) { wrapWriteFile(gameManager); }

        function showDownloadError(path) {
          var err = document.getElementById('moonfin-error');
          if (!err) { return; }
          err.style.display = 'block';
          err.textContent = 'Could not download ' + path + '.';
        }

        function watchExternalDownloads() {
          var files = window.EJS_externalFiles;
          if (!files || window.moonfinExternalWatch || typeof XMLHttpRequest !== 'function') { return; }
          var expected = [];
          for (var key in files) {
            var href = files[key];
            try { href = new URL(files[key], location.href).href; } catch (e) { /* keep raw */ }
            expected.push({ path: key, href: href });
          }
          if (!expected.length) { return; }
          window.moonfinExternalWatch = true;
          var Native = XMLHttpRequest;
          function PatchedXhr() {
            var xhr = new Native();
            var requestHref = '';
            var open = xhr.open;
            xhr.open = function (method, url) {
              requestHref = url;
              try { requestHref = new URL(url, location.href).href; } catch (e) { /* keep raw */ }
              return open.apply(xhr, arguments);
            };
            function fail() {
              for (var i = 0; i < expected.length; i++) {
                if (expected[i].href === requestHref) {
                  showDownloadError(expected[i].path);
                  return;
                }
              }
            }
            xhr.addEventListener('error', fail);
            xhr.addEventListener('abort', fail);
            xhr.addEventListener('load', function () {
              if (xhr.status >= 400) { fail(); }
            });
            return xhr;
          }
          PatchedXhr.prototype = Native.prototype;
          window.XMLHttpRequest = PatchedXhr;
        }

        function load() {
          var base = window.EJS_pathtodata;
          if (!base) { return; }
          watchExternalDownloads();
          var s = document.createElement('script');
          s.src = base + 'loader.js';
          document.body.appendChild(s);
        }
        var pending = window.moonfinBeforeLoader;
        if (pending && typeof pending.then === 'function') {
          pending.then(function (ok) {
            if (ok === false) { return; }
            load();
          }, function () { /* do not start without the arcade zip name */ });
        } else {
          load();
        }
      })();
    </script>
  </body>
</html>
